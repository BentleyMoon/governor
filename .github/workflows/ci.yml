name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Lint
        run: ruff check governor/ tests/

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Boot server, hit health, verify
        run: |
          python -m uvicorn governor.proxy:app --port 8765 &
          SERVER_PID=$!
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:8765/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/healthz
          curl -sf http://127.0.0.1:8765/v1/usage
          kill $SERVER_PID
