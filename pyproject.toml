[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "governor-proxy"
version = "0.1.0"
description = "Cut your LLM bill 30-60% with a one-line proxy change. Workload-classifying router for OpenAI-compatible APIs."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Bentley Moon", email = "futurisminstitute@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["llm", "openai", "anthropic", "proxy", "router", "cost-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
governor = "governor.cli:main"

[project.urls]
Homepage = "https://github.com/bentleymoon/governor"
Issues = "https://github.com/bentleymoon/governor/issues"
Paper = "https://github.com/bentleymoon/governor/blob/master/PAPER.md"

[tool.hatch.build.targets.wheel]
packages = ["governor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
